spring:
  application:
    name: language-service
  # Solo lo llama snippet-service, con un access token machine-to-machine de Auth0 para la API interna
  # (no la de los usuarios: un token del navegador no sirve acá). Spring valida la firma con las claves
  # públicas del tenant, el issuer, el vencimiento y la audience. Ninguno de los dos valores es secreto.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://${AUTH0_DOMAIN:dev-2fvmkxju8g70kqvs.us.auth0.com}/
          audiences: ${AUTH0_INTERNAL_AUDIENCE:https://snippet-searcher/internal}

# En false no pide token. Es solo para el docker compose de tu máquina, donde no suele estar la
# aplicación machine-to-machine de Auth0; en las VMs queda en true.
auth:
  enabled: ${AUTH_ENABLED:true}

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-parameters:
      # El código llega por /execution en un solo mensaje de WebSocket, y Tomcat acepta 8 KB por
      # defecto. El límite queda igual que el de un snippet en nginx.
      "[org.apache.tomcat.websocket.textBufferSize]": 1048576

# Cuánto espera una ejecución interactiva (US10) el input que pidió antes de cortarse.
execution:
  input-timeout: ${EXECUTION_INPUT_TIMEOUT:5m}

management:
  endpoints:
    web:
      exposure:
        include: health
