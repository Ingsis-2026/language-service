spring:
  application:
    name: language-service

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-parameters:
      # El código llega por /execution en un solo mensaje de WebSocket, y Tomcat acepta 8 KB por
      # defecto. El límite queda igual que el de un snippet en nginx.
      "[org.apache.tomcat.websocket.textBufferSize]": 1048576

# Cuánto espera una ejecución interactiva (US10) el input que pidió antes de cortarse.
execution:
  input-timeout: ${EXECUTION_INPUT_TIMEOUT:5m}

management:
  endpoints:
    web:
      exposure:
        include: health

# Con LOG_FORMAT=ecs, como en la imagen de Docker, los logs salen en JSON (Elastic Common Schema): una línea por
# log con el servicio (service.name) y el MDC (requestId, language...) como campos. Sin LOG_FORMAT salen en
# texto, que es lo cómodo para leerlos corriendo desde el IDE o en los tests; el MDC va entre corchetes antes
# del logger (el replace saca los corchetes vacíos de los logs que no tienen contexto).
logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: '%replace([%mdc] ){''^\[\] $'', ''''}'
